server.port=8080

spring.application.name=targetcart-ai

# Datasource - defaults to H2 for local development; set DB_URL to use MySQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:targetcart_ai;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# H2 Console (only for local development)
spring.h2.console.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Spring AI - OpenAI configuration via environment variables
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}
spring.ai.openai.chat.options.max-tokens=${OPENAI_MAX_TOKENS:1000}
