server.port=8080

spring.application.name=targetcart-ai

# Datasource - defaults to H2 for local development; set DB_URL to use MySQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:targetcart_ai;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# H2 Console (only for local development)
spring.h2.console.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
