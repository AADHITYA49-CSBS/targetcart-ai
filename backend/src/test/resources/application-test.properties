# Test profile: connects to the MySQL development database managed by db/docker-compose.yml.
# Override any of these via the DB_URL / DB_USERNAME / DB_PASSWORD / DB_DRIVER environment variables.
# The MySQL dev container must be running and seeded before running persistence tests.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/targetcart_ai}
spring.datasource.username=${DB_USERNAME:targetcart}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Spring AI - mock configuration for tests (no real API calls)
spring.ai.openai.api-key=test-key
spring.ai.openai.chat.options.model=gpt-4o-mini
